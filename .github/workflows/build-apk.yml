name: Build APK and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      required:
        description: 'Mark this update as REQUIRED (mandatory prompt)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/*.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Determine version code
        id: version
        run: |
          # versionCode = run number (monotonic, always increases on each build)
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "versionName=1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin/

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp *.html *.js *.css www/ 2>/dev/null || true

      - name: Add Android platform
        run: |
          # android/ is committed to the repo (see commit "Include android/ APK project").
          # Only run `cap add android` when the platform directory is missing, otherwise
          # it fails with "android platform already exists".
          if [ ! -d android ]; then
            ./node_modules/.bin/cap add android
          else
            echo "android/ already present in repo - skipping cap add android"
          fi

      - name: Fix Gradle network timeout
        run: |
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties ||
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Set version code
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.versionName }}\"/" android/app/build.gradle

      - name: Generate app icon
        run: npx @capacitor/assets generate --android

      - name: Sync web assets
        run: ./node_modules/.bin/cap sync android

      - name: Ensure Android SDK packages and licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK platforms installed:"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          exit ${PIPESTATUS[0]}

      - name: Upload gradle build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle_build.log

      - name: Stage APK for Cloudflare hosting
        run: |
          mkdir -p www/app
          cp android/app/build/outputs/apk/debug/app-debug.apk www/app/cardgame-v${{ steps.version.outputs.code }}.apk

      - name: Update version manifest
        run: |
          # يعتبر التحديث إلزاميًا إذا:
          #  1) طُلب يدويًا عبر workflow_dispatch (input: required=true)، أو
          #  2) ورد "UPDATE REQUIRED" في رسالة آخر commit
          if [ "${{ github.event.inputs.required }}" = "true" ]; then
            REQUIRED="true"
          elif echo "${{ github.event.head_commit.message }}" | grep -qi "UPDATE REQUIRED"; then
            REQUIRED="true"
          else
            REQUIRED="false"
          fi
          cat > www/version.json <<EOF
          {
            "version": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.versionName }}",
            "downloadUrl": "https://cardgame-5nv.pages.dev/app/cardgame-v${{ steps.version.outputs.code }}.apk",
            "releaseNotes": "",
            "required": "$REQUIRED"
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy www to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set - skipping Pages deploy. APK is still uploaded as artifact."
            exit 0
          fi
          npx wrangler pages deploy www --project-name=cardgame --branch=main
